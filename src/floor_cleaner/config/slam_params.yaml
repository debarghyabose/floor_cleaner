slam_toolbox:
  ros__parameters:

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link

    # LiDAR
    scan_topic: /scan

    # Mapping
    mode: mapping
    use_map_saver: true

    # Timing
    use_sim_time: true
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    # Map
    resolution: 0.05
    map_update_interval: 2.0

    # Laser
    min_laser_range: 0.12
    max_laser_range: 10.0

    # Scan processing
    throttle_scans: 1
    minimum_time_interval: 0.2

    # Movement required before adding scans
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true

    # Loop closing
    do_loop_closing: true

    # Debug
    debug_logging: false
